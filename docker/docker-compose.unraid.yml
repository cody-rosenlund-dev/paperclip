# Unraid + Portainer: pulls the published upstream image, does not build
# locally. See ../docs/deploy/unraid.md for the full setup walkthrough.
#
# Required (set in Portainer's stack Environment variables, not here):
#   BETTER_AUTH_SECRET                    - openssl rand -hex 32
#   PAPERCLIP_TOOL_ACTION_SIGNING_SECRET  - openssl rand -hex 32
#
# Optional:
#   PAPERCLIP_IMAGE_TAG   - defaults to "latest" (upstream's most recent
#                           tagged release, published only on `v*` tags)
#   PAPERCLIP_PUBLIC_URL  - defaults to the paperclip.rosenlund-fam.com
#                           NPM/Cloudflare Tunnel hostname (the browser-facing
#                           URL -- NOT the LAN ip:3131 NPM forwards to)
#   ANTHROPIC_API_KEY / OPENAI_API_KEY - only needed for API-key billing.
#     To use an existing Claude Pro / ChatGPT Plus subscription instead
#     (no per-token billing), leave these unset and run `claude login` /
#     `codex login` in the container's Portainer console. The image sets
#     HOME=/paperclip, so both CLIs write their credentials under the
#     /paperclip appdata mount below and survive container recreation.
#
# Portainer strips a bare "$" from env var values in its Environment UI --
# escape any secret containing one (e.g. an Argon2 hash) as "$$".
#
# NOTE: this repo contains symlinks under .claude/skills/, which Portainer's
# git-stack clone refuses for security reasons. Deploy this stack via
# Portainer's "Web editor" build method (paste this file's contents) rather
# than "Git repository" -- see docs/deploy/unraid.md.
services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:${PAPERCLIP_IMAGE_TAG:-latest}
    # Without this, a webhook-triggered redeploy just recreates the
    # container from whatever image is already cached locally -- it won't
    # actually fetch a newer ":latest".
    pull_policy: always
    container_name: paperclip
    restart: unless-stopped
    # See docker-compose.quickstart.yml for why this is set: tini is PID 1
    # inside the image and reaps orphaned agent descendants; this is the
    # backstop if something leaks anyway.
    pids_limit: 2048
    ports:
      # Host 3131 -> container 3100. The container always listens on 3100
      # internally (change via PORT or PAPERCLIP_LISTEN_PORT if you ever
      # need to, but there's no reason to here -- only the host side needs
      # to move to avoid a port collision).
      - "3131:3100"
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"

      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-https://paperclip.rosenlund-fam.com}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-}"

      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?PAPERCLIP_TOOL_ACTION_SIGNING_SECRET must be set}"

      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # Absolute appdata path, not a relative bind mount: Portainer's clone
      # (when git-sourced) lives on Unraid's ephemeral /data tmpfs, wiped on
      # reboot. This path is also what Unraid's Appdata Backup plugin
      # snapshots -- keep "paperclip" in its stop-list so the embedded
      # Postgres data gets a clean shutdown before the backup copy runs.
      # This is also where claude/codex subscription login credentials
      # persist (HOME=/paperclip in the image -> /paperclip/.claude,
      # /paperclip/.codex).
      - /mnt/user/appdata/paperclip:/paperclip
